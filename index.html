<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>パズル</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;color:#202420;background:#fff}body{display:grid;place-items:center}.gate{width:min(360px,calc(100% - 36px));display:grid;gap:12px}.gate label{font-size:16px;font-weight:650}.gate input{height:48px;padding:0 12px;border:1px solid #a5aaa5;border-radius:6px;font:16px system-ui}.gate button{height:46px;border:0;border-radius:6px;background:#a8d832;color:#20300b;font:700 16px system-ui}.message{min-height:1.4em;margin:0;font-size:14px;color:#5c625c}.play{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
</style>
</head>
<body>
<form class="gate" id="gate">
<label for="key">鍵を入力</label>
<input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
<button type="submit">開く</button>
<p class="message" id="message" role="status" aria-live="polite"></p>
</form>
<iframe class="play" id="play" title="ブレインブロック パズル"></iframe>
<script>
const form=document.querySelector('#gate'),input=document.querySelector('#key'),message=document.querySelector('#message'),frame=document.querySelector('#play');
function decodeKey(value){const b64=value.trim().replace(/-/g,'+').replace(/_/g,'/');const raw=atob(b64+'='.repeat((4-b64.length%4)%4));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
form.addEventListener('submit',async event=>{event.preventDefault();message.textContent='確認中…';try{const keyBytes=decodeKey(input.value);if(keyBytes.length!==32)throw new Error();const payload=new Uint8Array(await(await fetch('./game.enc',{cache:'no-store'})).arrayBuffer());if(payload.length<29)throw new Error();const key=await crypto.subtle.importKey('raw',keyBytes,{name:'AES-GCM'},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:payload.slice(0,12)},key,payload.slice(12));const gameHTML=new TextDecoder().decode(plain);keyBytes.fill(0);document.open();document.write(gameHTML);document.close()}catch(error){message.textContent=!globalThis.crypto?.subtle?'HTTPS接続で開いてください。':'鍵が違うか、暗号化ファイルを読み込めません。'}});
</script>
</body>
</html>
